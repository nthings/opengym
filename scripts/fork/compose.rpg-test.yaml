name: opengym-rpg

# Parallel test instance of the RPG fork (built from ~/opengym-rpg, branch rpg).
# Own data folder, own network, port 8092. The real openGym on 8091 is not touched.
services:
  api:
    build:
      context: /home/nthings/opengym-rpg/api
      target: default
    image: opengym-rpg-api:test
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - TRUST_PROXY=1
    volumes:
      - ./data:/data
    networks: [opengym-rpg-net]

  web:
    build:
      context: /home/nthings/opengym-rpg
      dockerfile: web/Dockerfile
    image: opengym-rpg-web:test
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${WEB_PORT:-8092}:80"
    environment:
      - NGINX_PORT=80
      - BACKEND=api
      - PORT=3000
    networks: [opengym-rpg-net]

networks:
  opengym-rpg-net:
    driver: bridge
    # Fixed: the daemon's automatic address pools are all used up on this host.
    ipam:
      config:
        - subnet: 10.89.92.0/24
