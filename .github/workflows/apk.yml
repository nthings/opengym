# RPG fork: builds a debug sideload APK to try on a phone. Debug has its own package
# (ch.duartesantos.opengym.test), so it installs next to the real app and needs no signing key.
# Run it by hand (Actions → APK → Run workflow) or push to the `rpg` branch.
name: APK

on:
  workflow_dispatch:
  push:
    branches: [rpg]

permissions:
  contents: read

env:
  NODE_VERSION: 26

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - name: Phone bundle + cap sync
        run: npm run build:mobile
        working-directory: frontend
      - name: Sideload debug APK
        working-directory: frontend/android
        run: ./gradlew --no-daemon assembleSideloadDebug
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: opengym-rpg-sideload-debug-apk
          path: frontend/android/app/build/outputs/apk/sideload/debug/*.apk
          retention-days: 14
          if-no-files-found: error
